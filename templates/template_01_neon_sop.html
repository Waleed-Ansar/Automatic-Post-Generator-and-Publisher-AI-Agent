<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    *{box-sizing:border-box} 
    body{margin:0;background:#07111f;font-family:Inter,Segoe UI,Arial,sans-serif;color:#f8fbff}

    /* RULE: Change height to min-height for dynamic growth */
    .post{
        width:1080px;
        min-height:1080px;
        height:auto;
        position:relative;
        background:radial-gradient(circle at 86% 15%,rgba(57,201,255,.20),transparent 30%),linear-gradient(145deg,#07111f 0%,#101827 65%,#07111f 100%);
        padding:72px;
        display:flex;
        flex-direction:column;
    }

    .frame{
        flex-grow:1;
        border:4px solid #26374f;
        border-radius:54px;
        padding:42px 40px 120px; /* Added bottom padding for CTA space */
        position:relative;
        display:flex;
        flex-direction:column;
    }

    .kicker{letter-spacing:.12em;text-transform:uppercase;color:#42c7ff;font-weight:900;font-size:28px}
    .header{font-size:68px;line-height:.96;font-weight:950;margin:46px 0 30px;max-width:820px}
    .sub{font-size:34px;line-height:1.12;color:#dfe8f4;max-width:760px;margin-bottom:20px}
    
    .list{display:grid;gap:24px;margin-top:34px;margin-bottom:40px}
    .item{display:grid;grid-template-columns:46px 1fr;gap:22px;align-items:start;color:#edf4fd;font-size:29px;line-height:1.15}

    /* FIX: Centering the square box perfectly */
    .dot{
        width:42px;
        height:42px;
        border-radius:50%;
        background:#13c89b;
        box-shadow:0 0 0 10px rgba(19,200,155,.12);
        display:flex;         /* Added */
        align-items:center;    /* Added */
        justify-content:center; /* Added */
    }

    .dot:after{
        content:"";
        width:12px;
        height:12px;
        border:2px solid #c6fff1;
        border-radius:2px;
        /* Removed position: absolute, right, and top */
    }

    /* CTA Pushes to bottom of frame */
    .cta{
        margin-top:auto;
        margin-left: auto;   /* Centers the box */
        margin-right: auto;  /* Centers the box */
        width: 80%;
        background:#41c4f6;
        color:#06101d;
        border-radius:24px;
        padding:20px 24px;
        text-align:center;
        font-weight:950;
        font-size:29px;
        line-height:1.04;
    }

    .link{position:absolute;right:42px;bottom:68px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;color:#8292aa;font-size:18px;letter-spacing:.04em}
    
    /* Brand stays pinned to the frame bottom left */
    .brand{position:absolute;left:40px;bottom:-14px;background:#07111f;padding:0 18px;color:#8090a8;font-size:26px;font-weight:900}
</style>
</head>
<body>
    <main id="post" class="post">
        <section class="frame">
            <div class="kicker">{{ sub_header }}</div>
            <h1 class="header">{{ header }}</h1>
            <p class="sub">{{ content_items[0] if content_items else content }}</p>
            
            <div class="list">
                {% for item in content_items[1:10] %} <div class="item">
                    <span class="dot"></span>
                    <span>{{ item }}</span>
                </div>
                {% endfor %}
            </div>

            <div class="cta">{{ cta }}</div>
            {% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}
            <div class="brand">{{ brand }}</div>
        </section>
    </main>
</body>
</html>
