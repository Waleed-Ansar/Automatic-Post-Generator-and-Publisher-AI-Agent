<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#252116;font-family:'Arial Black',Impact,Arial,sans-serif}.post{width:1080px;height:1080px;background:#efe0b9;position:relative;overflow:hidden;padding:58px}.post:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 2px,transparent 2px 7px)}.poster{position:relative;height:964px;border:8px solid #261d15;padding:42px;background:#f4e6c5;box-shadow:18px 18px 0 #261d15}.ribbon{background:#d94b2b;color:#fff;font-size:30px;text-transform:uppercase;letter-spacing:.08em;padding:16px 20px;display:inline-block;transform:rotate(-2deg);box-shadow:7px 7px 0 #261d15}.header{font-size:72px;line-height:.86;color:#261d15;margin:48px 0 22px;text-transform:uppercase;letter-spacing:-.03em;text-shadow:4px 4px 0 #e6b84a}.sub{font-family:Arial,sans-serif;font-weight:900;font-size:31px;line-height:1.15;color:#3a3025;margin-bottom:34px;max-width:850px}.rule{height:8px;background:repeating-linear-gradient(90deg,#261d15 0 34px,#e6b84a 34px 68px);margin-bottom:30px}.items{display:grid;gap:14px}.item{font-family:Arial,sans-serif;font-size:27px;line-height:1.1;font-weight:900;color:#261d15;background:#fff8dd;border:4px solid #261d15;padding:16px 18px 16px 68px;position:relative}.item:before{content:"!";position:absolute;left:18px;top:12px;width:34px;height:34px;border-radius:50%;background:#261d15;color:#f4e6c5;text-align:center;line-height:34px;font-family:Arial Black}.cta{position:absolute;left:42px;right:42px;bottom:54px;background:#261d15;color:#f6df9f;text-align:center;font-size:34px;line-height:1;padding:24px 28px;text-transform:uppercase;border:4px solid #d94b2b}.link{position:absolute;right:48px;bottom:20px;font-family:Arial,sans-serif;font-size:18px;font-weight:900;color:#584634}.brand{position:absolute;left:48px;bottom:20px;font-family:Arial,sans-serif;font-size:20px;font-weight:900;color:#584634}</style>
</head>
<body><main id="post" class="post"><section class="poster"><div class="ribbon">{{ sub_header }}</div><h1 class="header">{{ header }}</h1><p class="sub">{{ content_items[0] if content_items else content }}</p><div class="rule"></div><div class="items">{% for item in content_items[1:6] %}<div class="item">{{ item }}</div>{% endfor %}</div><div class="cta">{{ cta }}</div><div class="brand">{{ brand }}</div>{% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}</section></main></body></html>
