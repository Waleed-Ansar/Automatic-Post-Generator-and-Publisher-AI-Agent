<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #092445;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 24px;
}

/* 
    POST CONTAINER – dynamic height
    Removed fixed height and overflow:hidden.
    Keeps the blue background and grid overlay.
*/
.post {
    width: 1080px;
    max-width: 100%;
    position: relative;
    color: #eaf8ff;
    background: #0a2a4e;
    /* no fixed height, no overflow hidden – dynamic */
}

/* grid pattern overlay – covers full dynamic area */
.post:before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(122,211,255,.16) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(122,211,255,.16) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
}

/* outer border inset – adjusts with content height */
.post:after {
    content: "";
    position: absolute;
    inset: 58px;
    border: 2px solid rgba(122,211,255,.65);
    border-radius: 12px;
    pointer-events: none;
}

/* inner content wrapper – padding adjusted for bottom clearance */
.inner {
    position: relative;
    z-index: 2;
    padding: 78px 84px 140px 84px;   /* increased bottom padding for brand/link */
    display: flex;
    flex-direction: column;
}

/* meta row (kicker + brand) – unchanged */
.meta {
    display: flex;
    justify-content: space-between;
    color: #7ad3ff;
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .12em;
}

.header {
    font-size: 72px;
    line-height: .9;
    font-weight: 1000;
    letter-spacing: -.05em;
    margin: 60px 0 18px;
    max-width: 820px;
}

.sub {
    font-size: 31px;
    line-height: 1.18;
    max-width: 780px;
    color: #cfeeff;
    font-weight: 650;
    margin-bottom: 20px;
}

/* concentric diagram – absolute, stays in same position relative to .inner */
.diagram {
    position: absolute;
    right: 86px;
    top: 288px;
    width: 230px;
    height: 230px;
    border: 2px solid #7ad3ff;
    border-radius: 50%;
}

.diagram:before,
.diagram:after {
    content: "";
    position: absolute;
    inset: 35px;
    border: 2px dashed rgba(122,211,255,.75);
    border-radius: 50%;
}
.diagram:after {
    inset: 80px;
    background: #7ad3ff;
}

/* checklist – width fixed, grows with items */
.list {
    width: 650px;
    margin-top: 60px;
    display: grid;
    gap: 16px;
    margin-bottom: 20px;
}

.item {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 18px;
    align-items: start;
    border: 2px solid rgba(122,211,255,.55);
    background: rgba(2,15,32,.48);
    padding: 18px 20px;
}

.box {
    width: 36px;
    height: 36px;
    border: 3px solid #7ad3ff;
    position: relative;
    flex-shrink: 0;
}
.box:after {
    content: "";
    position: absolute;
    left: 8px;
    top: 6px;
    width: 16px;
    height: 9px;
    border-left: 4px solid #7ad3ff;
    border-bottom: 4px solid #7ad3ff;
    transform: rotate(-45deg);
}

.txt {
    font-size: 25px;
    line-height: 1.12;
    font-weight: 750;
}

/* 
    CTA – converted from absolute to normal flow
    sits after .list, uses margin-top for spacing
    retains original colors and typography
*/
.cta {
    background: #7ad3ff;
    color: #071d37;
    border-radius: 10px;
    padding: 24px 30px;
    font-size: 31px;
    line-height: 1.05;
    font-weight: 1000;
    text-transform: uppercase;
    text-align: center;
    margin-top: 48px;
    transition: transform 0.1s ease;
    width: 100%;
}

.cta:hover {
    transform: scale(1.01);
    cursor: pointer;
}

/* 
    Brand & Link – absolute within .inner
    Since .inner has padding-bottom: 140px, these sit comfortably
    at the bottom without overlapping content.
*/
.brand {
    position: absolute;
    right: 84px;
    bottom: 42px;
    color: #7ad3ff;
    font-size: 20px;
    font-weight: 900;
    background: transparent;
    pointer-events: none;
}

.link {
    position: absolute;
    right: 64px;
    bottom: 18px;          /* adjusted to sit below brand */
    color: #7ad3ff;
    font-size: 18px;
    font-weight: 800;
    text-decoration: none;
    pointer-events: auto;
}

/* responsive adjustments – maintain design integrity */
@media (max-width: 1100px) {
    .post {
        max-width: 100%;
    }
    .inner {
        padding: 60px 60px 130px 60px;
    }
    .header {
        font-size: 58px;
    }
    .sub {
        font-size: 26px;
    }
    .list {
        width: 100%;
        max-width: 650px;
    }
    .diagram {
        right: 40px;
        top: 260px;
        width: 180px;
        height: 180px;
    }
    .diagram:before, .diagram:after {
        inset: 25px;
    }
    .diagram:after {
        inset: 60px;
    }
    .cta {
        font-size: 26px;
        padding: 20px 26px;
        margin-top: 40px;
    }
}

@media (max-width: 860px) {
    .inner {
        padding: 40px 40px 110px 40px;
    }
    .diagram {
        position: relative;
        right: auto;
        top: auto;
        margin: 30px 0 20px auto;
        width: 160px;
        height: 160px;
    }
    .list {
        margin-top: 30px;
    }
    .header {
        font-size: 44px;
        margin: 40px 0 16px;
    }
    .sub {
        font-size: 22px;
    }
    .item {
        padding: 14px 16px;
        gap: 14px;
    }
    .txt {
        font-size: 20px;
    }
    .cta {
        font-size: 22px;
        padding: 16px 20px;
        margin-top: 32px;
    }
    .brand {
        right: 40px;
        bottom: 32px;
        font-size: 16px;
    }
    .link {
        right: 40px;
        bottom: 10px;
        font-size: 14px;
    }
}

@media (max-width: 640px) {
    body {
        padding: 24px 16px;
    }
    .inner {
        padding: 28px 28px 100px 28px;
    }
    .header {
        font-size: 36px;
    }
    .sub {
        font-size: 20px;
    }
    .meta {
        font-size: 16px;
    }
    .item {
        grid-template-columns: 36px 1fr;
        gap: 12px;
    }
    .box {
        width: 28px;
        height: 28px;
    }
    .box:after {
        left: 5px;
        top: 4px;
        width: 13px;
        height: 7px;
        border-width: 3px;
    }
    .txt {
        font-size: 18px;
    }
    .diagram {
        width: 120px;
        height: 120px;
        margin: 20px 0 16px auto;
    }
    .diagram:before, .diagram:after {
        inset: 15px;
    }
    .diagram:after {
        inset: 35px;
    }
}
</style>
</head>
<body>
    <main id="post" class="post">
        <section class="inner">
            <div class="meta">
                <span>{{ sub_header }}</span>
                <!-- brand moved to bottom, but meta row may still show brand? original had brand also in meta? We'll keep both for compatibility -->
                <span>{{ brand }}</span>
            </div>
            <h1 class="header">{{ header }}</h1>
            <p class="sub">{{ content_items[0] if content_items else content }}</p>
            
            <!-- concentric diagram – stays as decorative element -->
            <div class="diagram"></div>
            
            <!-- dynamic checklist items -->
            <div class="list">
                {% for item in content_items[1:6] %}
                <div class="item">
                    <span class="box"></span>
                    <span class="txt">{{ item }}</span>
                </div>
                {% endfor %}
            </div>

            <!-- CTA now in normal flow – no absolute positioning, no empty bottom -->
            <div class="cta">{{ cta }}</div>

            <!-- optional link label – absolute bottom right -->
            {% if link_label %}
            <div class="link">{{ link_label }}</div>
            {% endif %}
        </section>
    </main>
</body>
</html>
