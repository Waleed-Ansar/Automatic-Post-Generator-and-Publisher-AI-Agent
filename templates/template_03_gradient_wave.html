<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#111;font-family:Inter,Segoe UI,Arial,sans-serif}.post{width:1080px;height:1080px;position:relative;overflow:hidden;background:linear-gradient(135deg,#ff7a59 0%,#ffce3d 32%,#20d4af 66%,#2d7dff 100%);padding:70px}.wave{position:absolute;inset:auto -140px -230px -140px;height:560px;background:rgba(255,255,255,.24);border-radius:50% 50% 0 0/100% 100% 0 0;transform:rotate(-5deg)}.card{position:relative;height:940px;background:rgba(255,255,255,.87);border-radius:58px;padding:54px 58px;box-shadow:0 30px 70px rgba(0,0,0,.22);overflow:hidden}.chip{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:16px 24px;font-weight:950;font-size:25px;text-transform:uppercase;letter-spacing:.06em}.header{font-size:78px;line-height:.93;letter-spacing:-.055em;margin:52px 0 18px;color:#0b1020;font-weight:1000}.sub{font-size:34px;line-height:1.12;color:#19304e;font-weight:780;max-width:790px}.steps{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}.step{background:#fff;border:3px solid #111;border-radius:28px;padding:22px 22px 24px;min-height:116px;box-shadow:8px 8px 0 #111}.step b{display:block;font-size:20px;margin-bottom:10px}.step span{display:block;font-size:24px;line-height:1.16;font-weight:750;color:#121827}.cta{position:absolute;left:58px;right:58px;bottom:58px;background:#101828;color:white;border-radius:34px;padding:26px 32px;font-size:34px;line-height:1.02;font-weight:1000}.link{position:absolute;right:86px;bottom:25px;color:#102134;font-weight:900;font-size:18px}.brand{position:absolute;left:58px;bottom:24px;color:#102134;font-weight:900;font-size:20px}</style>
</head>
<body><main id="post" class="post"><div class="wave"></div><section class="card"><div class="chip">{{ sub_header }}</div><h1 class="header">{{ header }}</h1><p class="sub">{{ content_items[0] if content_items else content }}</p><div class="steps">{% for item in content_items[1:5] %}<div class="step"><b>STEP {{ loop.index }}</b><span>{{ item }}</span></div>{% endfor %}</div><div class="cta">{{ cta }}</div><div class="brand">{{ brand }}</div>{% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}</section></main></body></html>
