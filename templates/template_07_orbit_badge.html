<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    *{box-sizing:border-box} 
    body{margin:0;background:#06130f;font-family:Inter,Segoe UI,Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:40px 24px}
    
    /* DYNAMIC HEIGHT: no min-height, height auto, content drives size */
    .post{
        width:1080px;
        max-width:100%;
        height:auto;
        position:relative;
        background:#06130f;
        color:#eaffe9;
        padding:66px;
        display:flex;
        flex-direction:column;
    }

    /* badge container – no flex-grow, lets content determine height */
    .badge{
        position:relative;
        z-index:2;
        border-radius:50px;
        padding:48px;
        background:linear-gradient(180deg,rgba(10,43,34,.96),rgba(4,23,18,.96));
        border:2px solid rgba(99,255,181,.35);
        display:flex;
        flex-direction:column;
    }

    .kicker{
        display:inline-block;
        border:2px solid #63ffb5;
        border-radius:999px;
        padding:13px 22px;
        color:#63ffb5;
        font-size:22px;
        font-weight:950;
        text-transform:uppercase;
        letter-spacing:.12em;
        width:fit-content
    }

    .header{
        font-size:72px;
        line-height:.93;
        letter-spacing:-.05em;
        font-weight:1000;
        margin:42px 0 18px;
        max-width:810px
    }

    .sub{
        font-size:31px;
        line-height:1.15;
        color:#c9f6df;
        font-weight:650;
        max-width:785px;
        margin-bottom:40px
    }
    
    /* 2‑column feature grid – dynamic */
    .items{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:14px;
        margin-bottom:32px;  /* space before CTA, not auto */
    }

    .item{
        background:rgba(99,255,181,.12);
        border:1px solid rgba(99,255,181,.35);
        border-radius:22px;
        padding:17px 19px;
        font-size:23px;
        line-height:1.13;
        font-weight:750
    }
    
    /* CTA now in normal flow – no margin-top:auto to avoid empty space */
    .cta{
        background:#63ffb5;
        color:#05140f;
        border-radius:24px;
        padding:22px 30px;
        text-align:center;
        font-size:31px;
        font-weight:1000;
        width:100%;
        transition:transform 0.1s ease;
    }

    .cta:hover{
        transform:scale(1.01);
        cursor:pointer;
    }

    .meta-row{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px
    }

    .link{
        color:#83d7b2;
        font-size:18px;
        font-weight:800;
        text-decoration:none;
    }

    .brand{
        color:#83d7b2;
        font-size:20px;
        font-weight:900
    }

    /* responsive adjustments */
    @media (max-width: 1100px){
        .post{padding:48px 32px;}
        .badge{padding:40px;}
        .header{font-size:58px;}
        .sub{font-size:26px;}
        .item{font-size:20px;padding:14px 16px;}
        .cta{font-size:26px;padding:18px 24px;}
    }

    @media (max-width: 780px){
        body{padding:24px 16px;}
        .post{padding:32px 20px;}
        .badge{padding:28px 24px;}
        .header{font-size:42px;margin:28px 0 14px;}
        .sub{font-size:22px;margin-bottom:28px;}
        .items{grid-template-columns:1fr;gap:12px;margin-bottom:28px;}
        .item{font-size:18px;padding:12px 14px;}
        .cta{font-size:22px;padding:14px 20px;}
        .kicker{font-size:18px;padding:10px 18px;}
        .brand{font-size:16px;}
        .link{font-size:14px;}
    }
</style>
</head>
<body>
    <main id="post" class="post">
        <section class="badge">
            <div class="meta-row">
                <div class="brand">{{ brand }}</div>
                {% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}
            </div>
            
            <div class="kicker">{{ sub_header }}</div>
            <h1 class="header">{{ header }}</h1>
            <p class="sub">{{ content_items[0] if content_items else content }}</p>
            
            <div class="items">
                {% for item in content_items[1:7] %}
                <div class="item">{{ item }}</div>
                {% endfor %}
            </div>

            <!-- CTA now flows naturally after items – no margin-top:auto, no empty bottom -->
            <div class="cta">{{ cta }}</div>
        </section>
    </main>
</body>
</html>
