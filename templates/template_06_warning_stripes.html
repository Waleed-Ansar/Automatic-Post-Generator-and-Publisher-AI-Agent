<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#141414;font-family:Inter,Segoe UI,Arial,sans-serif}.post{width:1080px;height:1080px;background:#f6c437;position:relative;overflow:hidden}.stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.18) 0 28px,transparent 28px 56px);opacity:.45}.paper{position:absolute;inset:70px;background:#111;border-radius:42px;color:#fff;padding:48px 54px;box-shadow:0 26px 0 rgba(0,0,0,.28);overflow:hidden}.bar{position:absolute;left:0;right:0;top:0;height:34px;background:repeating-linear-gradient(90deg,#f6c437 0 60px,#111 60px 120px)}.tag{margin-top:34px;display:inline-flex;align-items:center;gap:14px;color:#f6c437;font-size:28px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em}.tag:before{content:"";width:34px;height:34px;background:#f6c437;clip-path:polygon(50% 0,100% 100%,0 100%)}.header{font-size:64px;line-height:.3;font-weight:1000;margin:42px 0 24px;text-transform:uppercase;letter-spacing:-.04em}.sub{font-size:32px;line-height:1.13;color:#e4e4e4;font-weight:650;max-width:800px}.items{margin-top:42px;display:grid;gap:16px}.item{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:18px;background:#202020;border-left:8px solid #f6c437;border-radius:16px;padding:18px 20px}.num{font-size:26px;color:#111;background:#f6c437;border-radius:14px;text-align:center;padding:12px 0;font-weight:1000}.txt{font-size:27px;line-height:1.12;font-weight:780}.cta{position:absolute;left:54px;right:54px;bottom:40px;background:#f6c437;color:#111;border-radius:18px;padding:24px 28px;font-size:32px;font-weight:1000;line-height:1.04}.link{position:absolute;right:54px;bottom:6px;color:#a3a3a3;font-size:18px;font-weight:800}.brand{position:absolute;left:54px;bottom:6px;color:#a3a3a3;font-size:20px;font-weight:900}</style>
</head>
<body><main id="post" class="post"><div class="stripes"></div><section class="paper"><div class="bar"></div><div class="tag">{{ sub_header }}</div><h1 class="header">{{ header }}</h1><p class="sub">{{ content_items[0] if content_items else content }}</p><div class="items">{% for item in content_items[1:5] %}<div class="item"><div class="num">{{ loop.index }}</div><div class="txt">{{ item }}</div></div>{% endfor %}</div><div class="cta">{{ cta }}</div><div class="brand">{{ brand }}</div>{% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}</section></main></body></html>
