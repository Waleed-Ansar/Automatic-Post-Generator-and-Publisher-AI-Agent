<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#050816;font-family:Inter,Segoe UI,Arial,sans-serif}.post{width:1080px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(circle at 22% 20%,#7c3aed 0 16%,transparent 37%),radial-gradient(circle at 83% 15%,#06b6d4 0 15%,transparent 34%),radial-gradient(circle at 68% 84%,#f43f5e 0 18%,transparent 38%),#050816;padding:70px}.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(28px);opacity:.42}.panel{height:940px;position:relative;z-index:2;background:linear-gradient(135deg,rgba(255,255,255,.21),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);border-radius:64px;box-shadow:0 30px 90px rgba(0,0,0,.42);padding:56px;color:white}.kicker{font-size:23px;letter-spacing:.18em;text-transform:uppercase;color:#c8f7ff;font-weight:900}.header{font-size:76px;line-height:.93;margin:38px 0 24px;letter-spacing:-.05em;font-weight:1000;max-width:830px}.sub{font-size:32px;line-height:1.15;color:#e7ecff;font-weight:650;max-width:760px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:46px}.cell{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);border-radius:26px;padding:20px 22px;min-height:114px}.cell .icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#67e8f9,#a78bfa);margin-bottom:12px}.cell p{margin:0;font-size:24px;line-height:1.17;font-weight:760}.cta{position:absolute;left:56px;right:56px;bottom:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;background:white;color:#080d1d;border-radius:999px;padding:22px 30px 22px 34px;font-size:29px;font-weight:1000}.link{font-size:17px;color:#4b5563;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand{position:absolute;left:60px;bottom:30px;color:rgba(255,255,255,.62);font-size:20px;font-weight:900}</style>
</head>
<body><main id="post" class="post"><section class="panel"><div class="kicker">{{ sub_header }}</div><h1 class="header">{{ header }}</h1><p class="sub">{{ content_items[0] if content_items else content }}</p><div class="grid">{% for item in content_items[1:5] %}<div class="cell"><div class="icon"></div><p>{{ item }}</p></div>{% endfor %}</div><div class="cta"><span>{{ cta }}</span>{% if link_label %}<span class="link">{{ link_label }}</span>{% endif %}</div><div class="brand">{{ brand }}</div></section></main></body></html>
