<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    *{box-sizing:border-box} 
    body{margin:0;background:#06130f;font-family:Inter,Segoe UI,Arial,sans-serif}
    
    /* Dynamic height: starts at 1080px but can grow */
    .post{
        width:1080px;
        min-height:1080px;
        height:auto;
        position:relative;
        background:#06130f;
        color:#eaffe9;
        padding:66px;
        display:flex;
        flex-direction:column;
    }

    .badge{
        position:relative;
        z-index:2;
        flex-grow:1;
        border-radius:50px;
        padding:48px;
        background:linear-gradient(180deg,rgba(10,43,34,.96),rgba(4,23,18,.96));
        border:2px solid rgba(99,255,181,.35);
        display:flex;
        flex-direction:column;
    }

    .kicker{display:inline-block;border:2px solid #63ffb5;border-radius:999px;padding:13px 22px;color:#63ffb5;font-size:22px;font-weight:950;text-transform:uppercase;letter-spacing:.12em;width:fit-content}
    .header{font-size:72px;line-height:.93;letter-spacing:-.05em;font-weight:1000;margin:42px 0 18px;max-width:810px}
    .sub{font-size:31px;line-height:1.15;color:#c9f6df;font-weight:650;max-width:785px;margin-bottom:40px}
    
    /* Flex grid for items so they stay above the CTA */
    .items{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:14px;
        margin-bottom:40px;
    }
    .item{background:rgba(99,255,181,.12);border:1px solid rgba(99,255,181,.35);border-radius:22px;padding:17px 19px;font-size:23px;line-height:1.13;font-weight:750}
    
    /* Margin-top:auto pushes the CTA to the bottom of the badge */
    .cta{
        margin-top:auto;
        background:#63ffb5;
        color:#05140f;
        border-radius:24px;
        padding:22px 30px;
        text-align:center;
        font-size:31px;
        font-weight:1000;
        width:100%;
    }

    .meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .link{color:#83d7b2;font-size:18px;font-weight:800}
    .brand{color:#83d7b2;font-size:20px;font-weight:900}
</style>
</head>
<body>
    <main id="post" class="post">
        <section class="badge">
            <div class="meta-row">
                <div class="brand">{{ brand }}</div>
                {% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}
            </div>
            
            <div class="kicker">{{ sub_header }}</div>
            <h1 class="header">{{ header }}</h1>
            <p class="sub">{{ content_items[0] if content_items else content }}</p>
            
            <div class="items">
                {% for item in content_items[1:7] %} <div class="item">{{ item }}</div>
                {% endfor %}
            </div>

            <div class="cta">{{ cta }}</div>
        </section>
    </main>
</body>
</html>
