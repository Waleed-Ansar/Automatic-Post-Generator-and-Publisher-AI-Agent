<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#ede9df;font-family:Georgia,'Times New Roman',serif;color:#111}.post{width:1080px;height:1080px;background:#f7f2e8;padding:66px 72px;position:relative;overflow:hidden}.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #111;padding-bottom:18px;font:800 22px/1.1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}.seal{border:3px solid #111;border-radius:999px;padding:12px 18px}.layout{display:grid;grid-template-columns:1fr 330px;gap:48px;margin-top:52px}.header{font-size:74px;line-height:.92;margin:0 0 26px;font-weight:900;letter-spacing:-.045em}.sub{font:800 28px/1.15 Arial,sans-serif;text-transform:uppercase;color:#c34b25;margin-bottom:42px}.content{border-top:2px solid #111}.item{display:grid;grid-template-columns:38px 1fr;border-bottom:2px solid #111;padding:23px 0;gap:16px;font:600 27px/1.22 Arial,sans-serif}.num{font-weight:950;color:#c34b25}.aside{background:#111;color:#f8f2e7;border-radius:4px;padding:32px 26px;min-height:560px;position:relative}.aside:before{content:"";position:absolute;inset:18px;border:1px solid rgba(255,255,255,.35)}.aside-title{font:900 23px/1.1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:#f2c84b;margin-bottom:26px}.quote{font-size:42px;line-height:1.02;font-weight:900}.cta{position:absolute;left:72px;right:72px;bottom:70px;background:#c34b25;color:#fff;font:950 34px/1.05 Arial,sans-serif;padding:24px 32px;display:flex;justify-content:space-between;gap:28px;align-items:center}.link{font-size:18px;line-height:1.15;font-weight:800;max-width:300px;opacity:.85}.brand{position:absolute;bottom:26px;left:72px;font:800 20px Arial,sans-serif;color:#5b554d}</style>
</head>
<body><main id="post" class="post"><div class="topline"><span>{{ sub_header }}</span><span class="seal"></span></div><section class="layout"><div><h1 class="header">{{ header }}</h1><div class="sub">Action checklist</div><div class="content">{% for item in content_items[:5] %}<div class="item"><span class="num">{{ '%02d' % loop.index }}</span><span>{{ item }}</span></div>{% endfor %}</div></div><aside class="aside"><div class="aside-title">Public Safety Note</div><div class="quote">Clean with care. Act before dust moves.</div></aside></section><div class="cta"><span>{{ cta }}</span>{% if link_label %}<span class="link">{{ link_label }}</span>{% endif %}</div><div class="brand">{{ brand }}</div></main></body></html>
