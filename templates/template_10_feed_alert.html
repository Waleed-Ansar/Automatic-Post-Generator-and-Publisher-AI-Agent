<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#e9eef5;font-family:Inter,Segoe UI,Arial,sans-serif}.post{width:1080px;height:1080px;background:linear-gradient(180deg,#eef4fb,#d9e3f0);position:relative;overflow:hidden;padding:70px;color:#172033}.phone{width:720px;height:940px;margin:0 auto;background:#fff;border-radius:58px;box-shadow:0 40px 85px rgba(31,45,61,.25);padding:30px;position:relative;border:10px solid #172033}.top{height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e5e7eb;padding-bottom:20px}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#10b981,#38bdf8)}.brand{font-size:22px;font-weight:1000}.menu{font-size:30px;font-weight:1000;color:#94a3b8}.alert{margin-top:34px;background:#fff7ed;border:3px solid #fb923c;border-radius:30px;padding:26px}.kicker{display:inline-block;background:#fb923c;color:#111827;border-radius:999px;padding:10px 17px;font-size:18px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em}.header{font-size:56px;line-height:.94;font-weight:1000;letter-spacing:-.045em;margin:30px 0 18px;color:#111827}.sub{font-size:27px;line-height:0.7;font-weight:720;color:#334155}.items{margin-top:26px;display:grid;gap:14px}.item{background:#fff;border:2px solid #fed7aa;border-radius:20px;padding:15px 17px 15px 54px;position:relative;font-size:23px;line-height:1.14;font-weight:760}.item:before{content:"";position:absolute;left:18px;top:18px;width:20px;height:20px;border-radius:6px;background:#10b981}.cta{margin-top:26px;background:#172033;color:#fff;border-radius:22px;padding:21px 24px;font-size:28px;line-height:1.05;font-weight:1000;text-align:center}.actions{display:flex;gap:18px;margin-top:24px;color:#64748b;font-size:23px;font-weight:900}.link{position:absolute;left:20px;bottom:-66px;border-radius:18px;padding:15px 18px;font-size:20px;font-weight:800;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}.bubble{position:absolute;border-radius:50%;background:#38bdf8;opacity:.24}.b1{width:210px;height:210px;left:-68px;top:118px}.b2{width:270px;height:270px;right:-110px;bottom:150px;background:#fb923c}.b3{width:145px;height:145px;right:110px;top:30px;background:#10b981}</style>
</head>
<body><main id="post" class="post"><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><section class="phone"><div class="top"><div style="display:flex;align-items:center;gap:14px"><div class="avatar"></div><div class="brand">{{ brand }}</div></div><div class="menu">•••</div></div><article class="alert"><div class="kicker">{{ sub_header }}</div><h1 class="header">{{ header }}</h1><p class="sub">{{ content_items[0] if content_items else content }}</p><div class="items">{% for item in content_items[1:5] %}<div class="item">{{ item }}</div>{% endfor %}</div><div class="cta">{{ cta }}</div><div class="actions"></div></article>{% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}</section></main></body></html>
