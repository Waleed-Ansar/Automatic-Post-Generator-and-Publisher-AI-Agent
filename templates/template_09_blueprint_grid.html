<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#092445;font-family:Inter,Segoe UI,Arial,sans-serif}.post{width:1080px;height:1080px;position:relative;overflow:hidden;color:#eaf8ff;background:#0a2a4e}.post:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(122,211,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(122,211,255,.16) 1px,transparent 1px);background-size:36px 36px}.post:after{content:"";position:absolute;inset:58px;border:2px solid rgba(122,211,255,.65);border-radius:12px}.inner{position:relative;z-index:2;padding:78px 84px}.meta{display:flex;justify-content:space-between;color:#7ad3ff;font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.header{font-size:72px;line-height:.9;font-weight:1000;letter-spacing:-.05em;margin:60px 0 18px;max-width:820px}.sub{font-size:31px;line-height:1.18;max-width:780px;color:#cfeeff;font-weight:650}.diagram{position:absolute;right:86px;top:288px;width:230px;height:230px;border:2px solid #7ad3ff;border-radius:50%}.diagram:before,.diagram:after{content:"";position:absolute;inset:35px;border:2px dashed rgba(122,211,255,.75);border-radius:50%}.diagram:after{inset:80px;background:#7ad3ff}.list{width:650px;margin-top:60px;display:grid;gap:16px}.item{display:grid;grid-template-columns:44px 1fr;gap:18px;align-items:start;border:2px solid rgba(122,211,255,.55);background:rgba(2,15,32,.48);padding:18px 20px}.box{width:36px;height:36px;border:3px solid #7ad3ff;position:relative}.box:after{content:"";position:absolute;left:8px;top:6px;width:16px;height:9px;border-left:4px solid #7ad3ff;border-bottom:4px solid #7ad3ff;transform:rotate(-45deg)}.txt{font-size:25px;line-height:1.12;font-weight:750}.cta{position:absolute;left:84px;right:84px;bottom:-100px;background:#7ad3ff;color:#071d37;border-radius:10px;padding:24px 30px;font-size:31px;line-height:1.05;font-weight:1000;text-transform:uppercase}.link{position:absolute;right:64px;bottom:-180px;color:#7ad3ff;font-size:18px;font-weight:800}.brand{position:absolute;right:84px;bottom:42px;color:#7ad3ff;font-size:20px;font-weight:900}</style>
</head>
<body><main id="post" class="post"><section class="inner"><div class="meta"><span>{{ sub_header }}</span><span>{{ brand }}</span></div><h1 class="header">{{ header }}</h1><p class="sub">{{ content_items[0] if content_items else content }}</p><div class="diagram"></div><div class="list">{% for item in content_items[1:6] %}<div class="item"><span class="box"></span><span class="txt">{{ item }}</span></div>{% endfor %}</div><div class="cta">{{ cta }}</div>{% if link_label %}<div class="link">{{ link_label }}</div>{% endif %}</section></main></body></html>
