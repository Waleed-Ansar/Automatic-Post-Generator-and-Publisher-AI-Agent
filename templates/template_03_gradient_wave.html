<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Canvas | Prism Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 24px;
        }

        /* 
            POST CONTAINER – fully dynamic height
            Removed fixed height and overflow:hidden → expands with content.
        */
        .post {
            width: 1080px;
            max-width: 100%;
            position: relative;
            background: linear-gradient(135deg, #ff7a59 0%, #ffce3d 32%, #20d4af 66%, #2d7dff 100%);
            padding: 70px;
            /* no height, no overflow hidden – dynamic */
        }

        /* WAVE DECOR – preserved exactly, stays behind the card */
        .wave {
            position: absolute;
            inset: auto -140px -230px -140px;
            height: 560px;
            background: rgba(255, 255, 255, 0.24);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            transform: rotate(-5deg);
            pointer-events: none;
        }

        /* 
            CARD – dynamic height, flex column layout
            - removed fixed height and overflow:hidden
            - added bottom padding to accommodate absolute brand + link
            - uses flex column to naturally stack content
        */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.87);
            border-radius: 58px;
            padding: 54px 58px 100px 58px;   /* increased bottom padding for brand/link */
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.22);
            display: flex;
            flex-direction: column;
        }

        /* chip (top badge) – unchanged */
        .chip {
            display: inline-block;
            background: #111;
            color: #fff;
            border-radius: 999px;
            padding: 16px 24px;
            font-weight: 950;
            font-size: 25px;
            text-transform: uppercase;
            letter-spacing: .06em;
            width: fit-content;
        }

        /* main headline */
        .header {
            font-size: 78px;
            line-height: .93;
            letter-spacing: -.055em;
            margin: 52px 0 18px;
            color: #0b1020;
            font-weight: 1000;
        }

        .sub {
            font-size: 34px;
            line-height: 1.12;
            color: #19304e;
            font-weight: 780;
            max-width: 790px;
            margin-bottom: 20px;
        }

        /* 2‑column steps grid – flexible, grows with content */
        .steps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 48px;
            margin-bottom: 20px;
        }

        .step {
            background: #fff;
            border: 3px solid #111;
            border-radius: 28px;
            padding: 22px 22px 24px;
            min-height: 116px;
            box-shadow: 8px 8px 0 #111;
        }

        .step b {
            display: block;
            font-size: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .step span {
            display: block;
            font-size: 24px;
            line-height: 1.16;
            font-weight: 750;
            color: #121827;
        }

        /* 
            CTA – converted to normal flow (not absolute)
            - sits below steps, uses margin-top for spacing
            - keeps original background, border-radius, font, padding
            - no longer overlaps brand/link due to card's bottom padding
        */
        .cta {
            background: #101828;
            color: white;
            border-radius: 34px;
            padding: 26px 32px;
            font-size: 34px;
            line-height: 1.02;
            font-weight: 1000;
            text-align: center;
            margin-top: 48px;
            transition: transform 0.2s ease, background 0.2s ease;
            width: 100%;
        }

        /* 
            Brand & Link – still absolute relative to .card
            Since .card has padding-bottom:100px, these elements sit 
            in that reserved area without overlapping content.
        */
        .brand {
            position: absolute;
            left: 58px;
            bottom: 32px;
            color: #102134;
            font-weight: 900;
            font-size: 20px;
            background: transparent;
            pointer-events: none;
        }

        .link {
            position: absolute;
            right: 58px;
            bottom: 32px;
            color: #102134;
            font-weight: 900;
            font-size: 18px;
            text-decoration: none;
            pointer-events: auto;
        }

        /* optional hover effect for CTA (no design change, just polish) */
        .cta:hover {
            background: #1f2c44;
            cursor: pointer;
        }

        /* responsive – preserve layout integrity */
        @media (max-width: 1100px) {
            .post {
                padding: 48px 32px;
            }
            .card {
                padding: 40px 42px 90px 42px;
            }
            .header {
                font-size: 62px;
            }
            .sub {
                font-size: 28px;
            }
            .steps {
                gap: 16px;
            }
            .step span {
                font-size: 20px;
            }
            .cta {
                font-size: 28px;
                padding: 22px 28px;
                margin-top: 40px;
            }
        }

        @media (max-width: 780px) {
            body {
                padding: 24px 16px;
            }
            .post {
                padding: 32px 20px;
            }
            .card {
                padding: 32px 28px 80px 28px;
            }
            .header {
                font-size: 44px;
                margin: 32px 0 16px;
            }
            .sub {
                font-size: 24px;
            }
            .steps {
                grid-template-columns: 1fr;
                gap: 18px;
                margin-top: 32px;
            }
            .step {
                min-height: auto;
            }
            .step span {
                font-size: 20px;
            }
            .cta {
                font-size: 24px;
                padding: 18px 24px;
                margin-top: 32px;
            }
            .brand {
                left: 32px;
                bottom: 24px;
                font-size: 16px;
            }
            .link {
                right: 32px;
                bottom: 24px;
                font-size: 14px;
            }
            .chip {
                font-size: 20px;
                padding: 12px 20px;
            }
        }

        /* preserve wave scaling on narrow screens (keeps visual charm) */
        @media (max-width: 780px) {
            .wave {
                height: 400px;
                inset: auto -100px -180px -100px;
            }
        }
    </style>
</head>
<body>
    <main id="post" class="post">
        <!-- decorative wave – stays behind card -->
        <div class="wave"></div>

        <!-- main card content – height automatically adjusts to content -->
        <section class="card">
            <!-- dynamic chip label -->
            <div class="chip">{{ sub_header }}</div>

            <!-- main headline -->
            <h1 class="header">{{ header }}</h1>

            <!-- subtext / first content item -->
            <p class="sub">{{ content_items[0] if content_items else content }}</p>

            <!-- dynamic step grid (2 columns, up to 4 items from content_items[1:5]) -->
            <div class="steps">
                {% for item in content_items[1:5] %}
                <div class="step">
                    <b>STEP {{ loop.index }}</b>
                    <span>{{ item }}</span>
                </div>
                {% endfor %}
            </div>

            <!-- CTA – now in normal flow (no absolute), auto-positions after steps -->
            <div class="cta">{{ cta }}</div>

            <!-- absolute brand mark (bottom left) -->
            <div class="brand">{{ brand }}</div>

            <!-- optional link label (bottom right) -->
            {% if link_label %}
            <div class="link">{{ link_label }}</div>
            {% endif %}
        </section>
    </main>
</body>
</html>
